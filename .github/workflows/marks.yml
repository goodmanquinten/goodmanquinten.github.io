name: Mark pitches to market

on:
  schedule:
    - cron: "30 22 * * 1-5"  # 22:30 UTC, after the U.S. close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/update_marks.py
      - name: Commit if the price changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/marks.json
          git diff --cached --quiet || git commit -m "data: mark pitches to market"
          git push
